[package]
name = "token-swap"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
testutils = ["soroban-sdk/testutils"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
arbitrary = { version = "1.3", features = ["derive"] }
bolero = "0.13.4"
bolero-generator = "0.13"
soroban-sdk = { workspace = true, features = ["testutils"] }
